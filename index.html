<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Whitehall Mystery Jack Track</title>
<style>
:root{--bg:#101010;--card:#1c1c1c;--card2:#292929;--line:#414141;--text:#f5f5f5;--muted:#a7a7a7;--gold:#d7b45c;--green:#79bb8d;--blue:#6d98c8;--red:#d86b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh}button,input{font:inherit;-webkit-appearance:none}button{touch-action:manipulation}
header{position:sticky;top:0;z-index:20;background:rgba(16,16,16,.98);padding:calc(9px + env(safe-area-inset-top)) 11px 8px;border-bottom:1px solid #333}
.header{max-width:650px;margin:auto;display:flex;align-items:center;justify-content:space-between}
h1{font-size:18px;line-height:1.1;margin:0;font-weight:900}.subtitle{font-size:10px;color:var(--muted);margin-top:2px}
.badge{background:var(--gold);color:#111;border-radius:8px;padding:6px 8px;font-size:11px;font-weight:900}
main{max-width:650px;margin:auto;padding:8px 10px 345px}
.title{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:900;margin:7px 2px 5px}
.setup-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.drop-input{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px;min-height:54px}
.drop-input.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.drop-input.done{border-color:var(--green);box-shadow:0 0 0 1px var(--green) inset}
.drop-input.available{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue) inset}
.drop-input small{display:block;color:var(--muted);font-size:9px;font-weight:700;margin-bottom:3px}
.drop-number{font-size:22px;font-weight:900;text-align:center;min-height:27px}
.drop-status{text-align:center;font-size:8px;color:var(--muted);margin-top:2px}
.start-panel{margin-top:8px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:8px}
.start-panel h2{font-size:12px;margin:0 0 6px}.start-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.start-btn{border:1px solid #555;background:var(--card2);color:white;border-radius:9px;padding:8px 2px;font-weight:850;font-size:12px}
.start-btn.selected{background:var(--gold);color:#111;border-color:var(--gold)}.start-btn:disabled{opacity:.3}
.start-hint{text-align:center;color:var(--muted);font-size:10px;margin-top:6px}
.round-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:6px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:9px;padding:7px 3px;font-size:11px;font-weight:850}
.tab.active{background:var(--gold);border-color:var(--gold);color:#111}.tab:disabled{opacity:.3}
.round-info{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 8px;margin-top:6px;font-size:10px}
.progress-mini{height:6px;background:#090909;border-radius:99px;overflow:hidden}.progress-mini i{display:block;height:100%;background:var(--gold)}
.start-cell-mini{min-width:54px;padding:4px 7px;border:1px solid #777;border-radius:7px;background:#181818;color:var(--gold);font-weight:900;text-align:center}
.start-cell-mini small{display:block;font-size:7px;color:#888}.start-cell-mini b{font-size:15px}
.round-info strong{font-size:14px}.start-box{color:var(--gold);font-weight:850}
.track{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:6px}
.cell{min-height:54px;padding:0;font:inherit;color:inherit;text-align:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;position:relative;display:flex;align-items:center;justify-content:center}
.cell .turn{position:absolute;top:3px;left:4px;font-size:7px;color:#666;font-weight:800}.cell .num{font-size:17px;font-weight:900;margin-top:5px}
.cell.zero{border-color:#777;background:#181818}.cell.zero .turn{color:var(--gold)}.cell.zero .num{font-size:19px}
.cell.current{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.cell.possible{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue) inset}
.cell.reached{border-color:var(--green);background:#172219}.cell.reached .num{color:#cdebd5}
.cell .marker{position:absolute;right:4px;bottom:3px;font-size:7px;color:var(--blue);font-weight:900}.cell.reached .marker{color:var(--green)}
.history-note{text-align:center;color:var(--muted);font-size:9px;margin-top:6px}
.drop-prompt{margin-top:7px;background:#18221b;border:1px solid #38533f;border-radius:10px;padding:7px;text-align:center;color:#d9f0df;font-size:10px;font-weight:850}
.drop-prompt.used{background:var(--card);border-color:var(--line);color:var(--muted)}
.bottom-actions{display:flex;gap:5px;margin-top:6px}.bottom-actions button{flex:1;border:0;border-radius:8px;padding:7px;background:var(--card2);color:white;font-size:10px;font-weight:800}.bottom-actions .danger{color:#ffb4b4}
.controls{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(16,16,16,.99);border-top:1px solid #444;padding:7px 9px calc(8px + env(safe-area-inset-bottom))}
.controls-inner{max-width:650px;margin:auto}.entry-row{display:flex;gap:5px}.entry{flex:1;min-height:42px;background:#080808;border:2px solid var(--gold);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900}.placeholder{color:#555}.back{width:48px;border:0;border-radius:9px;background:var(--card2);color:white;font-size:16px;font-weight:900}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:5px}.key{min-height:37px;border:0;border-radius:8px;background:#303030;color:white;font-size:19px;font-weight:900}.key.clear{font-size:10px}.add{width:100%;margin-top:5px;min-height:38px;border:0;border-radius:8px;background:var(--gold);color:#111;font-size:13px;font-weight:900}
.status{text-align:center;min-height:12px;color:var(--muted);font-size:9px;margin-top:3px}
.toast{position:fixed;left:50%;bottom:330px;transform:translateX(-50%);z-index:50;background:#eee;color:#111;border-radius:9px;padding:8px 11px;font-size:11px;font-weight:900;display:none;white-space:nowrap;box-shadow:0 4px 18px #0008}
.hidden{display:none!important}
@media(min-width:520px){main{padding-bottom:315px}}
</style>
</head>
<body>
<header><div class="header">
 <div><h1>Whitehall Mystery Jack Track</h1><div class="subtitle">Jack movement tracker</div></div>
 <div class="badge" id="badge">SETUP</div>
</div></header>

<main>
 <section id="setup">
  <div class="title">1 · Body drop locations</div>
  <div class="setup-grid" id="setupGrid"></div>
  <div class="start-panel">
   <h2>2 · Where does Jack start?</h2>
   <div class="start-grid" id="startGrid"></div>
   <div class="start-hint" id="startHint">Enter all four locations first.</div>
  </div>
 </section>

 <section id="game" class="hidden">
  <div class="title">Body drop locations</div>
  <div class="setup-grid" id="compactDrops"></div>
  <div class="round-tabs" id="tabs"></div>
  <div id="roundView"></div>
 </section>
</main>

<div class="controls"><div class="controls-inner">
 <div class="entry-row"><div class="entry placeholder" id="entry">—</div><button class="back" onclick="backspace()">⌫</button></div>
 <div class="keypad">
  <button class="key" onclick="digit('1')">1</button><button class="key" onclick="digit('2')">2</button><button class="key" onclick="digit('3')">3</button>
  <button class="key" onclick="digit('4')">4</button><button class="key" onclick="digit('5')">5</button><button class="key" onclick="digit('6')">6</button>
  <button class="key" onclick="digit('7')">7</button><button class="key" onclick="digit('8')">8</button><button class="key" onclick="digit('9')">9</button>
  <button class="key clear" onclick="clearEntry()">CLEAR</button><button class="key" onclick="digit('0')">0</button><button class="key" onclick="backspace()">⌫</button>
 </div>
 <button class="add" id="addBtn" onclick="addAction()">ADD MOVEMENT</button>
 <div class="status" id="status">Enter a number</div>
</div></div>
<div class="toast" id="toast"></div>

<script>
const KEY='whitehall-jack-v8',MAX=15;
let state=load()||newGame(),entry='',selectedDrop=null,viewedRound=1;

function newGame(){return{drops:['','','',''],start:'',usedDrops:[],rounds:[{start:'',moves:[],complete:false,reached:''},{start:'',moves:[],complete:false,reached:''},{start:'',moves:[],complete:false,reached:''}],currentRound:0}}
function load(){
 try{
  const s=JSON.parse(localStorage.getItem(KEY));
  if(!s||!Array.isArray(s.drops)||!Array.isArray(s.rounds)||s.rounds.length!==3)return null;
  if(!Array.isArray(s.usedDrops))s.usedDrops=s.rounds.map(r=>String(r.reached||'')).filter(Boolean);
  return s;
 }catch(e){return null}
}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function allDrops(){return state.drops.every(x=>/^\d{1,3}$/.test(String(x))&&Number(x)>=0&&Number(x)<=189)}
function active(){return state.rounds[state.currentRound-1]}
function currentLocation(r){return r.moves.length?r.moves[r.moves.length-1]:r.start}
function usedDropLocations(){
 const history=state.rounds.map(r=>String(r.reached||'')).filter(Boolean);
 const stored=Array.isArray(state.usedDrops)?state.usedDrops.map(String):[];
 return [...new Set([...stored,...history])];
}
function unusedDropIndexAtLocation(loc){
 const used=usedDropLocations();
 return state.drops.findIndex(d=>String(d)===String(loc)&&!used.includes(String(d)));
}
function render(){renderSetup();if(state.currentRound){document.getElementById('setup').classList.add('hidden');document.getElementById('game').classList.remove('hidden');renderGame()}else{document.getElementById('setup').classList.remove('hidden');document.getElementById('game').classList.add('hidden')}updateEntry()}
function renderSetup(){
 document.getElementById('badge').textContent=state.currentRound?'ROUND '+state.currentRound:'SETUP';
 document.getElementById('setupGrid').innerHTML=state.drops.map((v,i)=>`<button class="drop-input ${selectedDrop===i?'active':''} ${v?'done':''}" onclick="selectDrop(${i})"><small>Discovery ${i+1}</small><div class="drop-number">${v||'—'}</div><div class="drop-status">${selectedDrop===i?'ENTERING…':v?'SET':'Tap to enter'}</div></button>`).join('');
 const ready=allDrops();
 document.getElementById('startGrid').innerHTML=state.drops.map((v,i)=>`<button class="start-btn ${state.start&&String(state.start)===String(v)?'selected':''}" ${ready?'':'disabled'} onclick="chooseStart(${i})">${v||'—'}</button>`).join('');
 document.getElementById('startHint').textContent=!ready?'Enter all four locations first.':state.start?'Starting at '+state.start:'Tap Jack’s starting location';
}
function selectDrop(i){if(state.currentRound)return;selectedDrop=i;entry='';render()}
function chooseStart(i){
 if(!allDrops())return;
 state.start=state.drops[i];
 if(!Array.isArray(state.usedDrops))state.usedDrops=[];
 const firstDrop=String(state.start);
 if(!state.usedDrops.includes(firstDrop))state.usedDrops.push(firstDrop);
 state.currentRound=1;
 state.rounds[0].start=state.start;
 state.rounds[0].reached=firstDrop;
 viewedRound=1;
 selectedDrop=null;
 entry='';
 save();
 render();
}
function renderGame(){
 document.getElementById('badge').textContent='ROUND '+viewedRound;
 document.getElementById('compactDrops').innerHTML=state.drops.map((v,i)=>{
   const used=usedDropLocations().includes(String(v));
   const loc=String(currentLocation(state.rounds[viewedRound-1]));
   const live=viewedRound===state.currentRound&&!state.rounds[viewedRound-1].complete;
   const available=live&&!used&&state.rounds[viewedRound-1].moves.length>0&&loc===String(v);
   return `<button class="drop-input ${used?'done':''} ${available?'available':''}" onclick="tryDrop(${i})"><small>Discovery ${i+1}</small><div class="drop-number">${v}</div><div class="drop-status">${used?(String(v)===String(state.start)&&viewedRound===1?'START · DROPPED':'DROPPED'):available?'DROP HERE':'POSSIBLE LOCATION'}</div></button>`;
 }).join('');
 document.getElementById('tabs').innerHTML=state.rounds.map((r,i)=>`<button class="tab ${viewedRound===i+1?'active':''}" ${i+1>state.currentRound?'disabled':''} onclick="viewRound(${i+1})">Round ${i+1}${r.complete?' ✓':''}</button>`).join('');
 renderRound();
}
function viewRound(n){if(n>state.currentRound)return;viewedRound=n;entry='';render()}
function renderRound(){
 const r=state.rounds[viewedRound-1],live=viewedRound===state.currentRound&&!r.complete;
 const startCell=`<div class="cell zero"><span class="turn">0</span><span class="num">${r.start||'—'}</span></div>`;
 let movementCells='';
 for(let i=1;i<=MAX;i++){
   const n=r.moves[i-1]||'';
   const used=usedDropLocations().includes(String(n));
   const isDrop=state.drops.includes(n)&&!used;
   const isReached=r.complete&&String(n)===String(r.reached);
   const clickable=isDrop&&live;
   const tag=clickable?'button':'div';
   const click=clickable?` onclick="tryDropAtTracker(${JSON.stringify(String(n))})"`:'';
   movementCells+=`<${tag} class="cell ${!n?'empty':''} ${live&&i===r.moves.length+1?'current':''} ${isDrop?'possible':''} ${isReached?'reached':''}"${click}>
     <span class="turn">${i}</span><span class="num">${n||'—'}</span>
     ${isDrop?'<span class="marker">DROP</span>':''}${isReached?'<span class="marker">DROPPED</span>':''}
   </${tag}>`;
 }
 const prompt=live&&r.moves.length>0?(()=>{
   const loc=String(currentLocation(r));
   const idx=unusedDropIndexAtLocation(loc);
   if(idx<0)return `<div class="drop-prompt used">Current location is not an unused body-drop location.</div>`;
   return `<div class="drop-prompt">Jack is at Discovery ${idx+1} (${state.drops[idx]}) — tap it above if the body part is dropped here.</div>`;
 })():'';
 document.getElementById('roundView').innerHTML=`
 <div class="round-info">
   <div class="start-cell-mini"><small>0 · START</small><b>${r.start||'—'}</b></div>
   <div class="progress-mini"><i style="width:${Math.min(100,r.moves.length/MAX*100)}%"></i></div>
   <strong>${r.moves.length} / ${MAX}</strong>
 </div>
 <div class="track">${movementCells}</div>
 ${prompt}
 ${!live?`<div class="history-note">Body part dropped at ${r.reached||'—'} · archived for review</div>`:''}
 <div class="bottom-actions">${live?'<button onclick="undo()">↶ Undo last</button>':''}<button class="danger" onclick="resetGame()">Reset game</button></div>`;
}
function tryDrop(i){
 const r=state.rounds[state.currentRound-1],target=String(state.drops[i]);
 if(viewedRound!==state.currentRound||r.complete)return;
 if(r.moves.length===0){toast('You must move before dropping a body part');return}
 if(usedDropLocations().includes(target)){
   toast('That body-drop location has already been used');
   render();
   return;
 }
 if(String(currentLocation(r))!==target){toast('Jack is not at '+target);return}
 dropBody(i);
}
function tryDropAtTracker(location){
 const r=state.rounds[state.currentRound-1];
 if(viewedRound!==state.currentRound||r.complete)return;
 const target=String(location);
 const i=state.drops.findIndex(d=>String(d)===target);
 if(i<0)return;
 tryDrop(i);
}
function dropBody(i){
 const r=active(),target=String(state.drops[i]);
 const used=usedDropLocations();
 if(used.includes(target)){
   toast('That body-drop location has already been used');
   render();
   return;
 }
 if(String(currentLocation(r))!==target){
   toast('Jack is not at '+target);
   return;
 }
 if(!Array.isArray(state.usedDrops))state.usedDrops=[];
 state.usedDrops.push(target);
 r.complete=true;
 r.reached=target;
 save();
 if(state.currentRound<3){
   state.currentRound++;
   state.rounds[state.currentRound-1].start=target;
   viewedRound=state.currentRound;
   entry='';
   save();
   render();
   toast('Body part dropped — next round started');
 }else{
   entry='';
   save();
   render();
   toast('All body parts dropped — Jack wins!');
 }
}
function addAction(){
 if(!state.currentRound){
   if(selectedDrop===null){toast('Tap a Discovery box first');return}
   if(!entry){toast('Enter a circle number');return}
   const n=Number(entry);if(!Number.isInteger(n)||n<0||n>189){toast('Use a number from 0–189');return}
   if(state.drops.some((d,i)=>i!==selectedDrop&&String(d)===String(n))){toast('Each Discovery Location must be different');return}
   state.drops[selectedDrop]=String(n);entry='';save();render();return
 }
 const r=active();if(viewedRound!==state.currentRound||r.complete)return;
 if(!entry){toast('Enter a circle number');return}
 const n=Number(entry);if(!Number.isInteger(n)||n<0||n>189){toast('Use a number from 0–189');return}
 if(r.moves.length>=MAX){toast('15 movements reached');return}
 if(r.moves.length&&String(currentLocation(r))===String(n)){toast('Jack must move to a different circle');return}
 r.moves.push(String(n));entry='';save();render();
 if(r.moves.length===MAX)toast('15 movements reached');
}
function digit(d){
 if(!state.currentRound){if(selectedDrop===null||entry.length>=3)return;entry+=d;updateEntry();return}
 const r=active();if(viewedRound!==state.currentRound||r.complete||r.moves.length>=MAX||entry.length>=3)return;entry+=d;updateEntry()
}
function backspace(){entry=entry.slice(0,-1);updateEntry()}
function clearEntry(){entry='';updateEntry()}
function updateEntry(){
 const e=document.getElementById('entry');e.textContent=entry||'—';e.classList.toggle('placeholder',!entry);
 document.getElementById('addBtn').textContent=!state.currentRound?'SET LOCATION':'ADD MOVEMENT';
 document.getElementById('status').textContent=!state.currentRound?(selectedDrop===null?'Tap a Discovery box first':'Enter its circle number'):(viewedRound===state.currentRound&&!active().complete?(active().moves.length>=MAX?'15 movements reached':'Enter the next circle number'):'Viewing completed round')
}
function undo(){const r=active();if(!r.moves.length){toast('Nothing to undo');return}r.moves.pop();entry='';save();render()}
function resetGame(){if(!confirm('Reset the whole game? This will erase all drop locations and movement history.'))return;state=newGame();entry='';selectedDrop=null;viewedRound=1;save();render()}
document.addEventListener('keydown',e=>{if(e.key>='0'&&e.key<='9')digit(e.key);else if(e.key==='Backspace')backspace();else if(e.key==='Escape')clearEntry();else if(e.key==='Enter')addAction()});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();
</script>
</body>
</html>
