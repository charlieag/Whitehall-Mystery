<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111">
<title>Whitehall Mystery — Jack</title>
<style>
:root{
 --bg:#101010;--card:#1c1c1c;--card2:#282828;--line:#3d3d3d;
 --text:#f5f5f5;--muted:#a5a5a5;--gold:#d7b45c;--blue:#6fa0d8;
 --red:#d96868;--green:#79bb8d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh}
header{
 position:sticky;top:0;z-index:20;background:rgba(16,16,16,.97);
 padding:calc(9px + env(safe-area-inset-top)) 12px 9px;border-bottom:1px solid #333
}
.header-row{display:flex;justify-content:space-between;align-items:center}
h1{font-size:19px;margin:0;font-weight:800}.sub{font-size:11px;color:var(--muted);margin-top:2px}
#roundBadge{font-weight:800;font-size:13px;color:#111;background:var(--gold);padding:7px 9px;border-radius:9px}
main{max-width:620px;margin:auto;padding:10px 11px 245px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800;margin:10px 2px 6px}
.targets{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.target{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:5px}
.target span{display:block;text-align:center;color:var(--muted);font-size:9px;margin-bottom:3px}
.target input{
 width:100%;border:1px solid #555;background:#0d0d0d;color:white;border-radius:7px;
 text-align:center;font-size:18px;font-weight:800;padding:5px;outline:0
}
.target.active{border-color:var(--gold)}
.progress{
 margin-top:9px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px
}
.progress-top{display:flex;justify-content:space-between;align-items:center;font-size:12px}
.progress-top b{font-size:15px}
.bar{height:7px;background:#0d0d0d;border-radius:99px;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:var(--gold);width:0%}
.moves{
 margin-top:9px;display:grid;grid-template-columns:repeat(5,1fr);gap:5px
}
.move{
 min-height:55px;background:var(--card);border:1px solid var(--line);border-radius:10px;
 display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative
}
.move .n{position:absolute;top:4px;left:5px;font-size:8px;color:#666}
.move .v{font-size:18px;font-weight:800;margin-top:5px}
.move.empty .v{color:#444}
.move.current{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.move.special{border-color:var(--blue)}
.move .s{font-size:8px;color:var(--blue);font-weight:800;text-transform:uppercase;margin-top:1px}
.controls{
 position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(17,17,17,.98);
 border-top:1px solid #444;padding:8px 10px calc(8px + env(safe-area-inset-bottom))
}
.controls-inner{max-width:620px;margin:auto}
.entry-row{display:flex;gap:7px;align-items:stretch}
.move-now{
 width:64px;border-radius:11px;background:var(--card);border:1px solid var(--line);
 display:flex;flex-direction:column;align-items:center;justify-content:center
}
.move-now small{font-size:8px;color:var(--muted);text-transform:uppercase}.move-now b{font-size:24px}
.display{
 flex:1;background:#070707;border:2px solid var(--gold);border-radius:11px;
 display:flex;align-items:center;justify-content:center;font-size:29px;font-weight:900;min-height:52px
}
.specials{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:7px 0}
.special{
 background:var(--card2);border:1px solid #505050;color:white;border-radius:10px;
 padding:7px 3px;font-weight:800;font-size:12px
}
.special small{display:block;color:var(--muted);font-size:9px;font-weight:500;margin-top:1px}
.special.selected{border-color:var(--blue);background:#182433;color:#dbeaff}
.special.used{opacity:.35}
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.keypad button{
 min-height:40px;border:0;border-radius:10px;background:#303030;color:white;
 font-size:19px;font-weight:800
}
.keypad button:active,.special:active,button:active{transform:scale(.97)}
.keypad .clear{font-size:12px}.keypad .back{font-size:17px}
.keypad .add{background:var(--gold);color:#111;font-size:15px}
.actions{display:flex;gap:6px;margin-top:8px}
.actions button{flex:1;border:0;border-radius:9px;background:var(--card2);color:white;padding:9px;font-weight:700;font-size:12px}
.actions .end{background:#26382d;color:#cdebd5}.actions .danger{color:#ffb5b5}
.toast{
 position:fixed;left:50%;bottom:225px;transform:translateX(-50%);z-index:50;
 background:#eee;color:#111;border-radius:10px;padding:9px 12px;font-size:12px;font-weight:800;
 display:none;white-space:nowrap
}
@media(min-width:500px){.moves{grid-template-columns:repeat(8,1fr)}}
</style>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
<header>
 <div class="header-row">
  <div><h1>Whitehall Mystery</h1><div class="sub">Jack's secret movement tracker</div></div>
  <div id="roundBadge">ROUND 1</div>
 </div>
</header>

<main>
 <div class="label">Discovery locations</div>
 <div class="targets" id="targets"></div>

 <div class="progress">
  <div class="progress-top"><span>Current round</span><b id="count">0 / 15 turns</b></div>
  <div class="bar"><i id="bar"></i></div>
 </div>

 <div class="label">Movement track</div>
 <div class="moves" id="moves"></div>

 <div class="actions">
   <button onclick="undo()">↶ Undo</button>
   <button class="end" onclick="finishRound()">✓ Reached discovery</button>
 </div>
 <div class="actions">
   <button class="danger" onclick="resetGame()">Reset game</button>
 </div>
</main>

<div class="toast" id="toast"></div>

<div class="controls">
 <div class="controls-inner">
  <div class="entry-row">
   <div class="move-now"><small id="turnLabel">TURN</small><b id="turn">1</b></div>
   <div class="display" id="display">—</div>
   <button class="keypad back" onclick="backspace()">⌫</button>
  </div>

 <div id="coachHint" class="coach-hint"></div>

 <div class="specials" id="specials">
   <button class="special" data-type="coach" onclick="chooseSpecial('coach')">COACH <small>2 available</small></button>
   <button class="special" data-type="alley" onclick="chooseSpecial('alley')">ALLEY <small>2 available</small></button>
   <button class="special" data-type="boat" onclick="chooseSpecial('boat')">BOAT <small>2 available</small></button>
 </div>

 <div class="keypad">
  <button onclick="digit('1')">1</button><button onclick="digit('2')">2</button><button onclick="digit('3')">3</button><button onclick="digit('4')">4</button>
  <button onclick="digit('5')">5</button><button onclick="digit('6')">6</button><button onclick="digit('7')">7</button><button onclick="digit('8')">8</button>
  <button onclick="digit('9')">9</button><button onclick="digit('0')">0</button><button class="clear" onclick="clearEntry()">CLEAR</button><button class="add" id="addButton" onclick="addMove()">ADD ✓</button>
 </div>
 </div>
</div>

<script>
const KEY='whitehall-jack-tracker-v3';
let state=load()||fresh();
let entry='';
let special=null;
let coachFirst=null;

function fresh(){
 return {
  round:1,
  targets:['','','',''],
  rounds:[
   {start:'',moves:[],special:[]},
   {start:'',moves:[],special:[]},
   {start:'',moves:[],special:[]}
  ],
  used:{coach:0,alley:0,boat:0}
 };
}
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}

function render(){
 const r=state.rounds[state.round-1];
 document.getElementById('roundBadge').textContent='ROUND '+state.round;
 document.getElementById('count').textContent=r.moves.length+' / 15 turns';
 document.getElementById('bar').style.width=(r.moves.length/15*100)+'%';
 document.getElementById('turn').textContent=Math.min(r.moves.length+1,15);

 document.getElementById('targets').innerHTML=state.targets.map((v,i)=>`
  <div class="target ${i===0?'active':''}">
   <span>Discovery ${i+1}${i===0?' · START':''}</span>
   <input inputmode="numeric" maxlength="3" value="${esc(v)}"
    onchange="state.targets[${i}]=this.value.replace(/\\D/g,'').slice(0,3);save()">
  </div>`).join('');

 document.getElementById('moves').innerHTML=Array.from({length:15},(_,i)=>{
   let v=r.moves[i],s=r.special[i];
   let first=v?.[0]??'';
   return `<div class="move ${v?'':'empty'} ${i===r.moves.length?'current':''} ${s?'special':''}"
     onclick="${v?`editMove(${i})`:''}">
     <span class="n">${i+1}</span>
     <span class="v">${first||'—'}</span>
     ${s?`<span class="s">${s}</span>`:''}
   </div>`;
 }).join('');

 document.querySelectorAll('.special').forEach(btn=>{
   const t=btn.dataset.type, remaining=2-state.used[t];
   btn.classList.toggle('selected',special===t);
   btn.classList.toggle('used',remaining===0 && special!==t);
   btn.querySelector('small').textContent=remaining+' available';
 });

 const display = coachFirst!==null ? (entry ? coachFirst+' → '+entry : coachFirst+' → ?') : (entry||'—');
 document.getElementById('display').textContent=display;
 document.getElementById('turnLabel').textContent=coachFirst!==null?'COACH':'TURN';
 document.getElementById('coachHint').textContent =
   special==='coach'
   ? (coachFirst===null ? 'Coach: enter the first circle, then the second.' : 'Coach: enter the second circle.')
   : '';
 document.getElementById('addButton').textContent = special==='coach' && coachFirst!==null ? 'FINISH COACH ✓' : 'ADD ✓';
}
function digit(d){if(entry.length<3){entry+=d;render()}}
function backspace(){
 entry=entry.slice(0,-1);
 render();
}
function clearEntry(){
 entry='';coachFirst=null;special=null;render();
}
function chooseSpecial(t){
 const remaining=2-state.used[t];
 if(remaining<=0){toast('No '+t+' tiles left');return}
 if(special===t){special=null;coachFirst=null;entry='';render();return}
 special=t;coachFirst=null;entry='';render();
}
function currentLocation(){
 const r=state.rounds[state.round-1];
 if(r.moves.length) return r.moves[r.moves.length-1][0];
 return r.start || (state.round===1 ? state.targets[0] : '');
}
function isDiscovery(n){
 return state.targets.some(x=>x!=='' && String(x)===String(n));
}
function isCurrentLocation(n){
 const c=currentLocation();
 return c!=='' && String(c)===String(n);
}
function addMove(){
 const r=state.rounds[state.round-1];
 if(r.moves.length>=15){toast('15 turns reached — finish the round');return}
 if(!entry){toast('Enter the destination number');return}
 const n=Number(entry);
 if(!Number.isInteger(n)||n<0||n>189){toast('Use a circle number from 0–189');return}

 // Coach is a double move: two separate movement spaces.
 if(special==='coach'){
   if(coachFirst===null){
     if(isCurrentLocation(n)){toast('Coach must move away from the starting circle');return}
     if(isDiscovery(n)){toast('A Coach cannot enter a Discovery Location');return}
     coachFirst=String(n);
     entry='';
     render();
     return;
   }
   if(String(n)===String(coachFirst)){toast('Coach circles must be different');return}
   if(isCurrentLocation(n)){toast('Coach cannot return to the starting circle');return}
   if(isDiscovery(n)){toast('A Coach cannot enter a Discovery Location');return}
   if(r.moves.length>13){toast('Coach needs two movement spaces');return}

   r.moves.push([String(coachFirst)]);
   r.special.push('coach');
   r.moves.push([String(n)]);
   r.special.push('coach-continue');
   state.used.coach++;
   entry='';coachFirst=null;special=null;save();render();
   return;
 }

 // Alley / Boat: one movement space. Special movements cannot enter
 // Discovery Locations; the final move into a Discovery must be normal.
 if(special==='alley' || special==='boat'){
   if(isDiscovery(n)){toast('A special movement cannot enter a Discovery Location');return}
 }

 // Jack cannot remain on the same numbered circle for consecutive turns.
 if(isCurrentLocation(n)){toast('Jack must move to a different circle');return}

 r.moves.push([String(n)]);
 r.special.push(special);
 if(special)state.used[special]++;
 entry='';special=null;save();render();

 // Reaching a Discovery Location with a normal move ends the round.
 if(!special && isDiscovery(n) && String(n)!==(state.targets[0]||'')){
   setTimeout(()=>offerDiscovery(n),50);
 }
}
function offerDiscovery(n){
 const r=state.rounds[state.round-1];
 if(!r.moves.length || String(r.moves[r.moves.length-1][0])!==String(n)) return;
 if(state.round>=3){
   toast('Final Discovery reached — Jack wins!');
   return;
 }
 if(confirm('Discovery Location reached: '+n+'\\nStart the next round?')){
   startNextRound();
 }
}
function startNextRound(){
 const r=state.rounds[state.round-1];
 if(state.round>=3)return;
 const finalLoc=r.moves[r.moves.length-1][0];
 state.round++;
 state.rounds[state.round-1].start=finalLoc;
 entry='';special=null;coachFirst=null;save();render();
}
function editMove(i){
 const r=state.rounds[state.round-1];
 const s=r.special[i]||null;

 if(s==='coach'){
   const first=r.moves[i]?.[0]??'';
   const second=r.moves[i+1]?.[0]??'';
   state.used.coach--;
   r.moves=r.moves.slice(0,i);
   r.special=r.special.slice(0,i);
   special='coach'; coachFirst=first; entry=second;
 } else if(s==='coach-continue'){
   const first=r.moves[i-1]?.[0]??'';
   const second=r.moves[i]?.[0]??'';
   state.used.coach--;
   r.moves=r.moves.slice(0,i-1);
   r.special=r.special.slice(0,i-1);
   special='coach'; coachFirst=first; entry=second;
 } else {
   const val=r.moves[i]?.[0]??'';
   if(s)state.used[s]--;
   r.moves=r.moves.slice(0,i);
   r.special=r.special.slice(0,i);
   special=s; coachFirst=null; entry=val;
 }
 save();render();
}
function undo(){
 const r=state.rounds[state.round-1];
 if(!r.moves.length){toast('Nothing to undo');return}
 const s=r.special[r.special.length-1];
 if(s==='coach-continue'){
   r.moves.pop();r.special.pop();
   r.moves.pop();r.special.pop();
   state.used.coach--;
 } else {
   r.moves.pop();r.special.pop();
   if(s)state.used[s]--;
 }
 entry='';special=null;coachFirst=null;save();render();
}
function finishRound(){
 const r=state.rounds[state.round-1];
 if(!r.moves.length){toast('Add at least one turn first');return}
 if(state.round>=3){toast('Final Discovery reached — Jack wins!');return}
 const finalLoc=String(r.moves[r.moves.length-1][0]);
 const isNewDiscovery=state.targets.some((x,i)=>i>0 && x!=='' && String(x)===finalLoc);
 if(!isNewDiscovery){
   toast('The last movement is not a Discovery Location');
   return;
 }
 if(confirm('Start the next round from Discovery Location '+finalLoc+'?')){
   startNextRound();
 }
}
function resetGame(){
 if(!confirm('Erase the whole tracker and start a new game?'))return;
 state=fresh();entry='';special=null;coachFirst=null;save();render();
}
function toast(t){
 const x=document.getElementById('toast');x.textContent=t;x.style.display='block';
 clearTimeout(window._toast);window._toast=setTimeout(()=>x.style.display='none',1500);
}
render();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
</script>

</body>

<style>
.move .arrow{color:#777;font-size:12px}
.coach-hint{height:16px;text-align:center;color:#d7b45c;font-size:10px;font-weight:700}
.move .v{white-space:nowrap}
</style>

</html>
