<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Whitehall Mystery — Jack Tracker</title>
<style>
:root{--bg:#101010;--card:#1c1c1c;--card2:#292929;--line:#414141;--text:#f5f5f5;--muted:#a7a7a7;--gold:#d7b45c;--green:#78b98b;--red:#d86b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh}button,input{-webkit-appearance:none;font:inherit}button{touch-action:manipulation}
header{position:sticky;top:0;z-index:20;background:rgba(16,16,16,.98);padding:calc(10px + env(safe-area-inset-top)) 12px 10px;border-bottom:1px solid #333}
.header{max-width:640px;margin:auto;display:flex;justify-content:space-between;align-items:center}
h1{font-size:19px;line-height:1.1;margin:0;font-weight:850}.subtitle{font-size:11px;color:var(--muted);margin-top:3px}
.round-badge{background:var(--gold);color:#111;border-radius:9px;padding:7px 9px;font-size:12px;font-weight:900;white-space:nowrap}
main{max-width:640px;margin:auto;padding:10px 11px 390px}
.section-label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:850;margin:11px 2px 6px}
.discovery-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.discovery{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:5px;text-align:center}
.discovery small{display:block;color:var(--muted);font-size:9px;margin-bottom:3px}
.discovery input{width:100%;background:#0b0b0b;border:1px solid #555;color:white;border-radius:7px;padding:5px 2px;text-align:center;font-size:18px;font-weight:850;outline:0}
.discovery input:focus{border-color:var(--gold)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:5px}
.tab{background:var(--card);border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:9px 4px;font-size:12px;font-weight:800}
.tab.active{background:var(--gold);color:#111;border-color:var(--gold)}.tab:disabled{opacity:.35}
.round-info{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px;margin-top:7px}
.info-row{display:flex;justify-content:space-between;align-items:center;font-size:12px}.info-row strong{font-size:15px}
.progress{height:7px;background:#090909;border-radius:99px;overflow:hidden;margin-top:7px}.progress i{display:block;height:100%;background:var(--gold)}
.track{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:8px}
.cell{min-height:53px;background:var(--card);border:1px solid var(--line);border-radius:9px;display:flex;align-items:center;justify-content:center;position:relative}
.cell .turn{position:absolute;top:4px;left:5px;color:#666;font-size:8px;font-weight:700}.cell .num{font-size:18px;font-weight:900;margin-top:6px}
.cell.empty .num{color:#444}.cell.current{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}.cell.reached{border-color:var(--green)}
.history-note{text-align:center;color:var(--muted);font-size:11px;margin:9px 0}
.drop-panel{background:#19221b;border:1px solid #385340;border-radius:12px;padding:9px;margin-top:8px}
.drop-title{font-size:12px;font-weight:850;margin-bottom:6px}.drop-buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.drop{background:#243329;color:#d9f0df;border:1px solid #486650;border-radius:9px;padding:8px 2px;font-size:11px;font-weight:800}.drop:disabled{opacity:.3}
.utility{display:flex;gap:6px;margin-top:8px}.utility button{flex:1;background:var(--card2);color:white;border:0;border-radius:9px;padding:9px;font-size:12px;font-weight:750}.utility .danger{color:#ffb4b4}
.controls{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(16,16,16,.985);border-top:1px solid #444;padding:8px 10px calc(9px + env(safe-area-inset-bottom))}
.controls-inner{max-width:640px;margin:auto}.entry-row{display:flex;gap:6px;align-items:stretch}
.entry{flex:1;min-height:48px;background:#080808;border:2px solid var(--gold);border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;letter-spacing:.03em}
.entry.placeholder{color:#555}.action-small{width:54px;border:0;border-radius:10px;background:var(--card2);color:white;font-size:16px;font-weight:800}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:7px}.key{min-height:44px;border:0;border-radius:10px;background:#303030;color:white;font-size:21px;font-weight:850}
.key.clear{font-size:12px}.key.back{font-size:17px}.add{width:100%;margin-top:7px;min-height:44px;border:0;border-radius:10px;background:var(--gold);color:#111;font-size:15px;font-weight:900}
.status{text-align:center;min-height:14px;color:var(--muted);font-size:10px;margin-top:5px}
.toast{position:fixed;left:50%;bottom:335px;transform:translateX(-50%);z-index:50;background:#eee;color:#111;border-radius:10px;padding:9px 12px;font-size:12px;font-weight:850;display:none;white-space:nowrap;box-shadow:0 4px 20px #0008}
@media(min-width:520px){.track{grid-template-columns:repeat(8,1fr)}main{padding-bottom:340px}}
</style>
</head>
<body>
<header><div class="header">
 <div><h1>Whitehall Mystery</h1><div class="subtitle">Jack movement tracker · v6</div></div>
 <div class="round-badge" id="badge">ROUND 1</div>
</div></header>

<main>
 <div class="section-label">Discovery locations</div>
 <div class="discovery-grid" id="discoveries"></div>
 <div class="section-label">Rounds</div>
 <div class="tabs" id="tabs"></div>
 <div id="roundView"></div>
</main>

<div class="controls"><div class="controls-inner">
 <div class="entry-row"><div class="entry placeholder" id="entry">—</div><button class="action-small" onclick="backspace()">⌫</button></div>
 <div class="keypad">
  <button class="key" onclick="digit('1')">1</button><button class="key" onclick="digit('2')">2</button><button class="key" onclick="digit('3')">3</button>
  <button class="key" onclick="digit('4')">4</button><button class="key" onclick="digit('5')">5</button><button class="key" onclick="digit('6')">6</button>
  <button class="key" onclick="digit('7')">7</button><button class="key" onclick="digit('8')">8</button><button class="key" onclick="digit('9')">9</button>
  <button class="key clear" onclick="clearEntry()">CLEAR</button><button class="key" onclick="digit('0')">0</button><button class="key back" onclick="backspace()">⌫</button>
 </div>
 <button class="add" onclick="addMove()">ADD MOVEMENT</button>
 <div class="status" id="status">Enter the next circle number</div>
</div></div>
<div class="toast" id="toast"></div>

<script>
const KEY='whitehall-jack-clean-v1',MAX_MOVES=15;
let state=load()||newGame(),entry='',viewedRound=1;

function newGame(){return{discoveries:['','','',''],rounds:[{moves:[],complete:false,reached:''},{moves:[],complete:false,reached:''},{moves:[],complete:false,reached:''}],currentRound:1}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));return s&&Array.isArray(s.rounds)&&s.rounds.length===3?s:null}catch(e){return null}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function activeRound(){return state.rounds[state.currentRound-1]}
function currentLocation(){const r=activeRound();return r.moves.length?r.moves[r.moves.length-1]:(state.currentRound===1?state.discoveries[0]:'')}
function render(){renderDiscoveries();renderTabs();renderRound();updateEntry()}
function renderDiscoveries(){document.getElementById('discoveries').innerHTML=state.discoveries.map((v,i)=>`<div class="discovery"><small>Discovery ${i+1}</small><input inputmode="numeric" maxlength="3" value="${esc(v)}" onchange="setDiscovery(${i},this.value)"></div>`).join('')}
function setDiscovery(i,v){state.discoveries[i]=String(v).replace(/\D/g,'').slice(0,3);save();render()}
function renderTabs(){document.getElementById('tabs').innerHTML=state.rounds.map((r,i)=>{const n=i+1;return `<button class="tab ${n===viewedRound?'active':''}" ${n>state.currentRound?'disabled':''} onclick="viewRound(${n})">Round ${n}${r.complete?' ✓':''}</button>`}).join('')}
function viewRound(n){if(n>state.currentRound)return;viewedRound=n;entry='';render()}
function discoveryIndex(v){const i=state.discoveries.findIndex(x=>String(x)===String(v));return i>=0?i+1:'?'}
function renderRound(){
 const r=state.rounds[viewedRound-1],current=state.currentRound===viewedRound&&!r.complete,count=r.moves.length;
 document.getElementById('badge').textContent='ROUND '+viewedRound;
 let h=`<div class="round-info"><div class="info-row"><span>${r.complete?'Completed':'Movements'}</span><strong>${count} / ${MAX_MOVES}</strong></div><div class="progress"><i style="width:${Math.min(100,count/MAX_MOVES*100)}%"></i></div>`;
 if(r.complete)h+=`<div class="history-note">Body part dropped at Discovery ${discoveryIndex(r.reached)} · ${r.reached}</div>`;
 else h+=`<div class="history-note">Starting location: ${viewedRound===1?(state.discoveries[0]||'—'):(state.rounds[viewedRound-2].reached||'—')}</div>`;
 h+=`</div><div class="track">`;
 for(let i=0;i<MAX_MOVES;i++)h+=`<div class="cell ${r.moves[i]?'':'empty'} ${current&&i===r.moves.length?'current':''}"><span class="turn">${i+1}</span><span class="num">${r.moves[i]||'—'}</span></div>`;
 h+=`</div>`;
 if(current){
  const buttons=state.discoveries.map((d,i)=>{
   const valid=d&&i>0&&String(d)===String(currentLocation());
   const used=state.rounds.some((rr,ri)=>ri<viewedRound&&String(rr.reached)===String(d));
   return `<button class="drop" ${valid&&!used?'':'disabled'} onclick="dropBody(${i})">${i+1}: ${d||'—'}</button>`;
  }).join('');
  h+=`<div class="drop-panel"><div class="drop-title">Body part dropped?</div><div class="drop-buttons">${buttons}</div></div><div class="utility"><button onclick="undo()">↶ Undo last</button><button class="danger" onclick="clearRound()">Clear round</button></div>`;
 }else if(r.complete)h+=`<div class="history-note">Archived round — use the tabs above to review the other rounds.</div>`;
 document.getElementById('roundView').innerHTML=h;
}
function updateEntry(){const e=document.getElementById('entry');e.textContent=entry||'—';e.classList.toggle('placeholder',!entry);const editable=state.currentRound===viewedRound&&!activeRound().complete;document.getElementById('status').textContent=editable?(activeRound().moves.length>=MAX_MOVES?'15 movements reached':'Enter the next circle number'):'Viewing a completed round'}
function digit(d){const r=activeRound();if(state.currentRound!==viewedRound||r.complete||r.moves.length>=MAX_MOVES||entry.length>=3)return;entry+=d;updateEntry()}
function backspace(){if(entry){entry=entry.slice(0,-1);updateEntry()}}
function clearEntry(){entry='';updateEntry()}
function addMove(){
 const r=activeRound();
 if(state.currentRound!==viewedRound||r.complete)return;
 if(!entry){toast('Enter a circle number');return}
 const n=Number(entry);
 if(!Number.isInteger(n)||n<0||n>189){toast('Use a number from 0–189');return}
 if(r.moves.length>=MAX_MOVES){toast('15 movements reached');return}
 if(r.moves.length&&String(r.moves[r.moves.length-1])===String(n)){toast('Jack must move to a different circle');return}
 r.moves.push(String(n));entry='';save();renderRound();updateEntry();
 if(r.moves.length===MAX_MOVES)toast('15 movements reached');
}
function dropBody(i){
 const r=activeRound(),target=state.discoveries[i];
 if(state.currentRound!==viewedRound||r.complete)return;
 if(!target){toast('Enter this Discovery Location first');return}
 if(String(currentLocation())!==String(target)){toast('Jack is not at that Discovery Location');return}
 if(i===0){toast('Discovery 1 is the starting location');return}
 if(state.rounds.some((rr,ri)=>ri<viewedRound&&String(rr.reached)===String(target))){toast('That Discovery Location was already used');return}
 r.complete=true;r.reached=String(target);save();
 if(state.currentRound<3){state.currentRound++;viewedRound=state.currentRound;entry='';save();render();toast('Body part dropped — Round '+state.currentRound+' started')}
 else{render();toast('All four body parts dropped — Jack wins!')}
}
function undo(){const r=activeRound();if(!r.moves.length){toast('Nothing to undo');return}r.moves.pop();entry='';save();render()}
function clearRound(){if(!confirm('Clear every movement in this round?'))return;const r=activeRound();r.moves=[];r.complete=false;r.reached='';entry='';save();render()}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.style.display='block';clearTimeout(window._toast);window._toast=setTimeout(()=>x.style.display='none',1500)}
document.addEventListener('keydown',e=>{if(e.key>='0'&&e.key<='9')digit(e.key);else if(e.key==='Backspace')backspace();else if(e.key==='Escape')clearEntry();else if(e.key==='Enter')addMove()});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();
</script>
</body>
</html>
